name: Rebuild Music Monday from Airtable

# By hand, once, never on a schedule.
#
# A scheduled sync would make Airtable load-bearing again, which is the
# opposite of the direction this is going: carry thirteen years across in
# one pass, then post each Monday on the dash itself. After a good run this
# workflow is finished for good and the Airtable token can be deleted.
#
# Replaces "Import Music Monday photos", which moved the pictures but not
# the picks -- leaving the text frozen on a 17 Oct 2026 snapshot with two
# Mondays missing and one filed under the wrong artist.
#
# Safe to re-run: picture keys are derived from the date and the SQL is an
# upsert, so a second run overwrites each row with the same thing rather
# than making duplicates. It never deletes, so a week posted on the dash
# that Airtable has never heard of survives a rebuild.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rebuild" to run'
        required: true
        default: ''
      dry_run:
        description: 'Dry run: report what would change, write nothing'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: music-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "rebuild" ]; then
            echo "::error::Type \"rebuild\" in the confirm box to run this."
            exit 1
          fi

      - name: Refuse without an Airtable token
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          if [ -z "$AIRTABLE_TOKEN" ]; then
            echo "::error::AIRTABLE_TOKEN is not set."
            echo "Create a read-only Airtable personal access token scoped to the"
            echo "JETTY HUB base, then add it under Settings -> Secrets -> Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Read Airtable, resize the artwork, build the SQL
        working-directory: dash
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python rebuild_music.py

      - name: Stop here on a dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run. Nothing was written to R2 or D1."
          echo "Read the step above, then run again with the box unticked."

      # The bucket and the database normally exist already, because the
      # deploy makes them. These are here so the rebuild can be the very
      # first thing that runs, and because wrangler needs a literal
      # database_id in the config before it can talk to D1.
      - name: Make sure the bucket and database exist
        if: ${{ !inputs.dry_run }}
        working-directory: dash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python provision_r2.py
          python provision_d1.py

      - name: Upload the artwork to R2
        if: ${{ !inputs.dry_run }}
        working-directory: dash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          n=0
          for f in photos/*.webp; do
            key=$(basename "$f")
            npx --yes wrangler@4 r2 object put "jetty-dash-music/$key" \
              --file "$f" --content-type image/webp --remote >/dev/null
            n=$((n+1))
            if [ $((n % 25)) -eq 0 ]; then echo "  uploaded $n…"; fi
          done
          echo "Uploaded $n objects to jetty-dash-music."

      # Last, deliberately: a row may only claim a picture once the picture
      # is actually in the bucket. The other order leaves the page asking
      # for covers that are not there yet, which it hides rather than shows.
      - name: Write the picks to D1
        if: ${{ !inputs.dry_run }}
        working-directory: dash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute jetty_dash --remote --yes --file=music.sql
          echo "The archive is rebuilt. The Airtable token can be deleted now."
