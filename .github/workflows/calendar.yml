name: Deploy Jetty Calendar

# Deliberately separate from update.yml. The dashboard deploys when the budget
# workbook changes; the calendar deploys when its own code changes. Neither can
# break the other, and neither waits on the other.

on:
  push:
    branches: [main]
    paths:
      - 'calendar/**'
      - '.github/workflows/calendar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Gates the deploy. These need no browser, no network and no packages, so
      # they cost seconds -- and a schema file that cannot be parsed or a
      # migration that would overwrite a later edit never reaches production.
      # The browser suite is not run here: it needs Chromium, and a flaky UI
      # check blocking a deploy is worse than the check is worth.
      - name: Run the calendar's unit tests
        working-directory: calendar
        run: node tests/unit.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Creates the D1 database the first time and writes its id into
      # wrangler.toml on every run, so no database id is ever committed.
      - name: Provision calendar database
        working-directory: calendar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python provision_d1.py
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: calendar
          command: deploy

      # The Google Calendar feed is a second Worker, deliberately outside
      # Access: Access protects a Worker whole and cannot exempt one path, and
      # Google's fetchers carry no sign-in. It binds the same database read-only
      # and is guarded by ICS_KEY, which is set on it as its own secret.
      - name: Point the feed Worker at the same database
        working-directory: calendar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG: feed/wrangler.toml
        run: python provision_d1.py
      - name: Deploy the feed Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: calendar/feed
          command: deploy
