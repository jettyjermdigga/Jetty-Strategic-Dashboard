# Temporary. The one-off cleanup of Email/SMS rows saved before the rule
# existed: they still carry a venue or product highlights the form no longer
# shows. Dumps what it is about to clear into the job log first, so the old
# values survive the clearing, then clears and re-counts.
#
# Only two rows are affected, which is why this is a one-off query rather than
# a guarded migration shipped into the Worker.
#
# Delete once the cleanup is confirmed.
name: Count Email/SMS rows to clean

on:
  workflow_dispatch:
    inputs:
      clear:
        description: 'Actually clear the rows (otherwise only report)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The one predicate, written once: sub_types is a comma list, so a bare
      # LIKE '%email-sms%' would also match a longer key that starts with it.
      MATCH: "',' || REPLACE(sub_types, ', ', ',') || ',' LIKE '%,email-sms,%'"
      HAS: "(COALESCE(venue,'') != '' OR COALESCE(address,'') != '' OR COALESCE(city,'') != '' OR COALESCE(state,'') != '' OR COALESCE(zip,'') != '' OR COALESCE(products,'') NOT IN ('', '[]'))"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # wrangler.toml carries a placeholder id; the deploy fills it in the same
      # way. Without this the query goes to __D1_DATABASE_ID__.
      - name: Point at the calendar database
        working-directory: calendar
        run: python provision_d1.py

      - name: What is about to be cleared
        working-directory: calendar
        run: |
          npx --yes wrangler@4 d1 execute jetty_calendar --remote --json --command "
            SELECT id, title, start_date, venue, address, city, state, zip, products
            FROM items WHERE $MATCH AND $HAS"

      - name: Clear it
        if: inputs.clear
        working-directory: calendar
        run: |
          npx --yes wrangler@4 d1 execute jetty_calendar --remote --json --command "
            UPDATE items SET venue = NULL, address = NULL, city = NULL,
                             state = NULL, zip = NULL, products = NULL
            WHERE $MATCH AND $HAS"

      - name: What is left
        working-directory: calendar
        run: |
          npx --yes wrangler@4 d1 execute jetty_calendar --remote --json --command "
            SELECT COUNT(*) AS email_sms_rows,
                   SUM(CASE WHEN $HAS THEN 1 ELSE 0 END) AS still_carrying
            FROM items WHERE $MATCH"
