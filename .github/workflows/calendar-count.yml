# Temporary. Puts back the venues the Email/SMS cleanup should never have
# taken: two real festivals that carry an Email/SMS sub-type because there is
# an email campaign about them, not because they happen at a desk. Values are
# the ones the cleanup dumped before clearing, in run 38983627060.
#
# Delete once the restore is confirmed.
name: Restore the two festival venues

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point at the calendar database
        working-directory: calendar
        run: python provision_d1.py

      - name: Put the venues back
        working-directory: calendar
        run: |
          npx --yes wrangler@4 d1 execute jetty_calendar --remote --json --command "
            UPDATE items SET venue = 'Taylor Avenue Waterfront',
                             address = 'Taylor Ave & N Delaware Ave',
                             city = 'Beach Haven', state = 'NJ', zip = '08008'
            WHERE id = '080083f3-2ed2-4cef-a39d-dedfa3e73dc9';
            UPDATE items SET venue = '68th Street Beach',
                             address = '6805 Long Beach Blvd.',
                             city = 'Brant Beach', state = 'NJ', zip = '08008'
            WHERE id = '50ab354f-291a-41c6-acb5-99da6ad49dfe'"

      - name: Read them back
        working-directory: calendar
        run: |
          npx --yes wrangler@4 d1 execute jetty_calendar --remote --json --command "
            SELECT id, title, event_type, sub_types, venue, address, city, state, zip, products
            FROM items
            WHERE id IN ('080083f3-2ed2-4cef-a39d-dedfa3e73dc9',
                         '50ab354f-291a-41c6-acb5-99da6ad49dfe',
                         '0f1db3bf-3383-468d-9cd3-748f0edf6d71')"
