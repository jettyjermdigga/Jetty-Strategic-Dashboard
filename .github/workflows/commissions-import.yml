name: Import commissions from Airtable

# The one-time move of the two Airtable bases into the module's database.
#
# Manual only. It is keyed on each Airtable record id, written to a UNIQUE
# column, so running it twice imports nothing the second time rather than
# doubling every commission -- but it is still not something to fire on a
# push.
#
# The generated SQL holds invoice amounts, commission rates and what every
# rep earns. It is written to the runner, piped into D1 and deleted; it is
# never committed and never uploaded as an artifact.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Stop after N payments (0 = all). Use a small number for a dry run.'
        type: string
        default: '0'
      apply:
        description: 'Actually write to D1. Unticked, it only reports what it would write.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: commissions-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read Airtable and build the SQL
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          python scripts/import_commissions.py \
            --out "$RUNNER_TEMP/commissions-import.sql" \
            --limit "${{ inputs.limit }}"
          echo "statements: $(wc -l < "$RUNNER_TEMP/commissions-import.sql")"
      - uses: actions/setup-node@v4
        if: inputs.apply
        with:
          node-version: '22'
      # The database has to exist and wrangler.toml has to name it before
      # anything can be written into it.
      - name: Provision the commissions database
        if: inputs.apply
        working-directory: commissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python provision_d1.py
      - name: Load it into D1
        if: inputs.apply
        working-directory: commissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute jetty_commissions --remote \
            --file "$RUNNER_TEMP/commissions-import.sql" --yes
      - name: Shred the file
        if: always()
        run: rm -f "$RUNNER_TEMP/commissions-import.sql"
