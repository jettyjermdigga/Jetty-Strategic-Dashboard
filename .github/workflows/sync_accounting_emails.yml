name: Sync Accounting Emails

on:
  schedule:
    # Offset from the top of the hour/quarter-hour: GitHub's own docs warn that
    # schedule triggers queued at round times (:00, :15, :30, :45) are the most
    # congested slots and can be delayed for hours during high platform load.
    # Runs were observed to lag by 8+ hours on the old '*/15 * * * *' schedule.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse + log only, no writes to Airtable/Gmail)'
        type: boolean
        default: true
      diagnose_shopify:
        description: 'Run the one-off Shopify Admin API diagnostic instead of the normal sync'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Shopify Admin API diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_shopify
        env:
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
        run: python scripts/shopify_payout_diagnostic.py
      - name: Sync Shopify/Stripe/CardPointe/GoCardless/Printavo emails to Ledger
        if: "!(github.event_name == 'workflow_dispatch' && inputs.diagnose_shopify)"
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_DELEGATED_USER: ${{ secrets.GMAIL_DELEGATED_USER }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python scripts/sync_accounting_emails.py
