name: Update Jetty Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the source sheet has not changed'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Fetch previous publish metadata
        run: git fetch origin gh-pages --depth=1 2>/dev/null || true
      - name: Check if source sheet changed
        id: check
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: python scripts/check_modified.py
      - name: Should rebuild?
        id: gate
        run: |
          if [ "${{ steps.check.outputs.changed }}" = "true" ] || [ "${{ github.event_name == 'workflow_dispatch' && inputs.force }}" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download sheet from Google Drive
        if: steps.gate.outputs.rebuild == 'true'
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
        run: python scripts/download_sheet.py
      - name: Build dashboard
        if: steps.gate.outputs.rebuild == 'true'
        env:
          SOURCE_MODIFIED_TIME: ${{ steps.check.outputs.modified_time }}
        run: python scripts/build_dashboard.py
      # The dashboard itself now deploys only to Cloudflare Workers (behind
      # Access). gh-pages no longer serves the site, but check_modified.py
      # still reads meta.json off that branch to skip unnecessary rebuilds —
      # publish just that file, not the dashboard, to keep the check working
      # without exposing the data on an unauthenticated GitHub Pages URL.
      - name: Prepare metadata-only publish dir
        if: steps.gate.outputs.rebuild == 'true'
        run: mkdir -p meta_only && cp output/meta.json meta_only/meta.json
      - name: Publish build metadata to gh-pages
        if: steps.gate.outputs.rebuild == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./meta_only
          publish_branch: gh-pages
          force_orphan: true
      - name: Deploy to Cloudflare Workers
        if: steps.gate.outputs.rebuild == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
