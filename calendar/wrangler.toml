# The company calendar is its own Worker, deployed from this directory by
# .github/workflows/calendar.yml. It shares nothing with the Strategic
# Dashboard -- separate Worker, separate URL, separate deploy -- so calendar
# work can never disturb the dashboard.

name = "jetty-calendar"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
# Without this the platform serves matching files before the Worker runs, so
# the Access check below would never see a request for the page itself.
run_worker_first = true

# The Worker reads its table definitions out of worker/schema.sql at startup.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Calendar store. database_id is filled in at deploy time by provision_d1.py,
# which creates the database on first run and looks up its id on every run
# after that -- so there is no id to paste by hand and no way for the committed
# file to drift from the real database.
[[d1_databases]]
binding = "DB"
database_name = "jetty_calendar"
database_id = "__D1_DATABASE_ID__"

# Files attached to events. The bytes live here; the attachments table in D1 is
# the index. Nothing is served straight from the bucket -- every download goes
# through the Worker, which is what keeps it behind Cloudflare Access, so the
# bucket stays private with no public r2.dev URL and no custom domain.
[[r2_buckets]]
binding = "FILES"
bucket_name = "jetty-calendar-files"

[vars]
# Who may add or edit calendar items. Everyone else Cloudflare Access lets in
# sees the calendar read-only. Comma-separated, matched case-insensitively.
#
# Matched against the address Access authenticated, which is the mailbox the
# person signs in with -- not the address on their Slack profile.
#
# An address here has to be one Cloudflare Access will let in, or the person
# meets a sign-in wall rather than a calendar and nothing on this list
# explains why. ACCESS_DOMAINS below is that policy written down, and a test
# fails if an editor is on a domain it does not name.
#
# taylor.heussner@sunnysidecalifornia.com is the one outside address: she
# runs Jetty's paid placements at SunnySide, which is why she is also the
# Paid Advo watcher further down.
CALENDAR_EDITORS = "cory@jettylife.com,jeremy@jettylife.com,john@jettylife.com,joncoen@jettylife.com,arlynn@jettylife.com,colleen@jettylife.com,k.hehl@jettylife.com,d.bachowski@jettylife.com,joem@jettylife.com,wholesale@jettylife.com,jjmckenna@jettylife.com,taylor.heussner@sunnysidecalifornia.com,kyle@jettyrockfoundation.org,jessica@jettyrockfoundation.org"

# The email domains the calendar's Cloudflare Access application admits.
#
# Nothing reads this at runtime -- Access decides, not the Worker. It is here
# so CALENDAR_EDITORS can be checked against it: an editor on a domain Access
# blocks is a line of config that looks right and does nothing, and the person
# it names gets a sign-in wall with no clue who to ask. Change the Access
# policy and change this with it.
ACCESS_DOMAINS = "jettylife.com,sunnysidecalifornia.com,jettyrockfoundation.org"

# Fill these in to switch identity checking from "trust the Access header" to
# "verify the Access JWT". ACCESS_TEAM_DOMAIN is your Zero Trust team domain
# (e.g. jetty.cloudflareaccess.com); ACCESS_AUD is the Application Audience tag
# on the Access application protecting THIS Worker -- the calendar needs its own
# Access application, separate from the dashboard's.
ACCESS_TEAM_DOMAIN = "wild-pine-bbc7.cloudflareaccess.com"
# Every Access application in front of this Worker, comma-separated -- each
# mints tokens carrying its own AUD. Just one today: the Worker policy set on
# the Worker's own Access tab, which is what actually puts Access in front of
# a Worker. Hostname applications did not, whatever they claimed to cover.
ACCESS_AUD = "9d5dfc7cd33c026b2403255f25ceeb6e4f395ab5332e247594bc433f687409a0"

# The calendar refuses to serve anything to a request that did not come through
# Cloudflare Access. This is what keeps a brand-new Worker hostname from being
# world-readable in the window before its Access application exists. Only set it
# to "false" for local development.
REQUIRE_IDENTITY = "true"

# Where the Google Calendar feed lives. A Worker of its own, outside Access,
# because Access protects a Worker whole and Google cannot sign in. This
# Worker never serves the feed -- it only hands out the link.
FEED_ORIGIN = "https://jetty-calendar-feed.jeremy-85e.workers.dev"

# There is no shared feed key any more. Each person gets their own token the
# first time they open Subscribe, stored in the feeds table -- so a link that
# gets out is reset for that one person rather than for everybody. The token is
# the credential; see calendar/feed/.

# Who is told when a Paid Advo item is created, changed or deleted.
#
# Taylor at SunnySide buys the paid media, and a date that moves after the
# placement is booked costs real money -- so the calendar tells them rather
# than waiting for somebody here to remember to. Comma-separated; empty turns
# it off entirely.
#
# Two deliveries, and only the first is guaranteed:
#
#   A comment on the event itself, mentioning them. This always happens, and
#   it is what they see under "For you" when they open the calendar. It needs
#   nothing but an address, and it is the one that reaches somebody who is
#   not in Slack. They can reply to it, in the place the answer belongs.
#
#   A Slack DM, when that address has a Slack account in the workspace. Not
#   having one is not an error -- the comment already went -- so it starts
#   arriving on its own the day they are added to Slack.
#
# These addresses need to be ones Cloudflare Access will let in, or the
# person cannot open the event the comment is on. sunnysidecalifornia.com is
# already on the calendar's Access policy.
PAID_ADVO_WATCHERS = "taylor.heussner@sunnysidecalifornia.com"

# Where an event's sales report is announced, once the figures AND the
# export from the till are both on the event.
#
# A channel ID (the C0123ABCD on the channel's "View channel details"), not
# a #name: a renamed channel keeps its id and loses its name. The message
# carries an @channel, so pick the channel that should actually be pinged.
#
# Three things have to be true or nothing is sent, and the calendar says so
# on the event rather than failing quietly:
#   the SLACK_BOT_TOKEN secret is set;
#   the app has chat:write AND files:write, and was reinstalled after the
#     scopes were added -- a scope added to an installed app does nothing;
#   the app is a member of this channel (/invite it).
#
# Empty turns the announcement off entirely.
SALES_REPORT_CHANNEL = "CHDDD4GTE"

# Where "Add to Website Events page" posts, and who it addresses.
#
# Ticking that need on an event posts in this channel. It posts again if
# something that goes ON the page later moves -- the date, the time, the
# venue, the status, the link -- and once more if the tick comes off or the
# event is deleted, because the page does not know that on its own.
#
# A channel rather than a DM: a website listing is work somebody else can
# pick up if she is away, and a DM is invisible to everyone who could.
#
# WEBSITE_CHANNEL is a channel ID (C0123ABCD), not a #name. The app has to
# be a member of it -- /invite it, the same as the sales report channel.
#
# WEBSITE_WATCHER is the address on her SLACK profile, used only to turn
# the post into a mention that notifies her. Leave it empty and the post
# still goes to the channel, just without the ping.
WEBSITE_CHANNEL = "C4V064MQA"
WEBSITE_WATCHER = "k.hehl@jettylife.com"

# ── Boxy Bucks ───────────────────────────────────────────────────────────

# Who may open the leaderboard at /boxy.html and move a balance.
#
# Its own list rather than the editor list: running an event and running the
# rewards are different jobs, and this one decides what people get. Recording
# who was at an event is NOT gated on this -- any editor can do that, because
# it is part of running the event.
#
# Left empty it falls back to CALENDAR_EDITORS, so it can never be
# accidentally empty and lock everybody out.
#
# Addresses, not names -- BOXY_CHECKOUT below holds names, and the two sit
# close enough together to be easy to mix up. A name here lets nobody in.
BOXY_ADMINS = "jeremy@jettylife.com,cory@jettylife.com,joem@jettylife.com,jjmckenna@jettylife.com"

# What each role is worth by default. Every event can override it when
# somebody is added, and the number used is written onto that row -- so
# changing this never rewrites what an event was already worth.
#
# Anything unparseable here keeps the built-in value rather than becoming
# zero. "worked:0" does mean zero; "worked:" is a typo and is ignored.
BOXY_POINTS = "worked:2,volunteered:2,attended:1"

# Who can hand samples over. One Boxy Buck is one free sample, so a spend is
# a checkout, and a checkout has somebody's name on it.
#
# Written out rather than derived from the staff roster: these four run the
# cupboard, and the list should change when that changes, not when somebody
# is hired. Empty means no spend can be recorded at all -- the safe failure
# for a list that exists to put a name against stock going out the door.
BOXY_CHECKOUT = "Jeremy DeFilippis,JJ McKenna,Joe Mangino,Cory Higgins"
