<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jetty Company Calendar</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/rc_system.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/calendar.css">
</head>
<body>

<header class="site-top">
  <div class="brand">
    <img src="/assets/logo.png" alt="Jetty">
    <div class="divider"></div>
    <div>
      <div class="title-main">Company Calendar</div>
      <div class="title-sub">Jetty &middot; 2026</div>
    </div>
  </div>
  <div class="site-who" id="who"></div>
</header>

<div class="cal-bar">
  <div class="cal-nav">
    <button id="prev" title="Previous" aria-label="Previous">&#8249;</button>
    <button id="next" title="Next" aria-label="Next">&#8250;</button>
  </div>
  <button class="cal-btn" id="today">Today</button>
  <div class="cal-period" id="period">&nbsp;</div>

  <div class="cal-seg" id="views" role="group" aria-label="Calendar view">
    <button data-view="day">Day</button>
    <button data-view="month" aria-pressed="true">Month</button>
    <button data-view="year">Year</button>
    <button data-view="agenda">Agenda</button>
  </div>

  <div class="cal-spacer"></div>

  <label class="fld-inline" style="font-size:12.5px;opacity:.75">
    <span style="font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase">Colour by</span>
    <select id="colorBy" style="font-family:var(--body);font-size:13px;background:transparent;border:1px solid var(--surface-alt);border-radius:6px;padding:5px 8px">
      <option value="category">Category</option>
      <option value="division">Division</option>
    </select>
  </label>

  <button class="cal-btn" id="subscribe">Subscribe</button>
  <button class="cal-btn" id="importBtn" hidden>Import</button>
  <button class="cal-btn primary" id="addBtn" hidden>+ Add item</button>
</div>

<div class="cal-shell">
  <aside class="cal-side">
    <div class="cal-card">
      <h3>Categories</h3>
      <div id="catTree"></div>
      <div class="flt-actions">
        <button id="catAll">All</button>
        <button id="catNone">None</button>
      </div>
    </div>
    <div class="cal-card">
      <h3>Divisions</h3>
      <div id="divTree"></div>
    </div>
    <div class="cal-card">
      <h3>Status</h3>
      <div id="statTree"></div>
    </div>
  </aside>

  <main>
    <div id="notice"></div>
    <div class="cal-card" style="padding:0;overflow:hidden">
      <div id="view"><div class="cal-empty">Loading the calendar&hellip;</div></div>
    </div>
  </main>
</div>

<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">&nbsp;</h2>
      <button class="modal-x" id="modalX" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="/assets/calendar.js"></script>
</body>
</html>
