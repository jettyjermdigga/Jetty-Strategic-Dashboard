<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jetty Company Calendar</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/rc_system.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/calendar.css">
</head>
<body>

<header class="site-top">
  <div class="brand">
    <img src="/assets/logo.png" alt="Jetty">
    <div class="divider"></div>
    <div>
      <div class="title-main">Company Calendar</div>
      <div class="title-sub">Jetty &middot; 2026</div>
    </div>
  </div>
  <div class="site-who" id="who"></div>
</header>

<div class="cal-bar">
  <div class="cal-left">
    <button class="cal-btn" id="today">Today</button>
  </div>

  <div class="cal-mid">
    <button class="cal-arrow" id="prev" title="Previous month" aria-label="Previous month">&#8249;</button>
    <div class="cal-period" id="period">&nbsp;</div>
    <button class="cal-arrow" id="next" title="Next month" aria-label="Next month">&#8250;</button>
  </div>

  <div class="cal-right">
    <button class="cal-btn" id="subscribe">Subscribe</button>
    <button class="cal-btn" id="importBtn" hidden>Import</button>
    <button class="cal-btn primary" id="addBtn" hidden>+ Add event</button>
  </div>
</div>

<div class="filterbar" id="filterBar"></div>
<div id="filterStatus"></div>

<div class="cal-shell" id="shell">
  <main>
    <div id="notice"></div>
    <div class="cal-card" style="padding:0;overflow:hidden">
      <div id="view"><div class="cal-empty">Loading the calendar&hellip;</div></div>
    </div>
  </main>
  <aside class="cal-list" id="listPanel" hidden></aside>
</div>

<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">&nbsp;</h2>
      <button class="modal-x" id="modalX" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="/assets/calendar.js"></script>
</body>
</html>
