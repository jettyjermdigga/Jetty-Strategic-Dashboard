name = "jetty-strategic"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./output"
binding = "ASSETS"

# The Worker reads its table definitions out of worker/schema.sql at startup.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Calendar store. database_id is filled in at deploy time by
# scripts/provision_d1.py, which creates the database on first run and looks up
# its id on every run after that -- so there is no id to paste by hand and no
# way for the committed file to drift from the real database.
[[d1_databases]]
binding = "DB"
database_name = "jetty_calendar"
database_id = "__D1_DATABASE_ID__"

[vars]
# Who may add or edit calendar items. Everyone else Cloudflare Access lets in
# sees the calendar read-only. Comma-separated, matched case-insensitively.
CALENDAR_EDITORS = "jeremy@jettylife.com"

# Fill these in to switch identity checking from "trust the Access header" to
# "verify the Access JWT". ACCESS_TEAM_DOMAIN is your Zero Trust team domain
# (e.g. jetty.cloudflareaccess.com); ACCESS_AUD is the Application Audience tag
# on the Access application protecting this Worker. Until both are set the
# calendar still works, and the page shows a setup notice.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# ICS_KEY is a secret, not a var -- set it with:
#   wrangler secret put ICS_KEY
# Without it /calendar.ics stays closed.
