# The Jetty Dash is its own Worker, deployed from this directory by
# .github/workflows/dash.yml. It shares nothing with the calendar or the
# Strategic Dashboard -- separate Worker, separate URL, separate deploy -- so
# work on any one of them can never disturb the other two.
#
# It holds no data: no database, no bucket, no writes. Everything it points at
# keeps its own.

name = "jetty-dash"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# No workers.dev address, ever. Access applications are attached to hostnames,
# and jetty-dash.<account>.workers.dev is a different hostname from
# jettydash.com -- so leaving it on would publish the whole staff portal at
# an address with nothing in front of it. The custom domain is the only way in.

workers_dev = false

# The Worker reads its table definitions out of worker/schema.sql at startup.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# The four lists the dash maintains: tiles, categories, groups and people.
# provision_d1.py looks the database up by name on every deploy and writes its
# id in here, so no id is ever committed.
[[d1_databases]]
binding = "DB"
database_name = "jetty_dash"
database_id = "__D1_DATABASE_ID__"

# Music Monday artwork. Filled by .github/workflows/music-photos.yml, which
# pulls what Airtable holds, resizes it and pushes it here. Created by
# provision_r2.py on deploy; if that fails the binding is stripped and the
# archive simply shows no pictures.
[[r2_buckets]]
binding = "MUSIC"
bucket_name = "jetty-dash-music"

[assets]
directory = "./public"
binding = "ASSETS"
# Without this the platform serves matching files before the Worker runs, and
# /api/me would never reach it.
run_worker_first = true

[vars]
# Fill these in once the Access application for jettydash.com exists.
# ACCESS_TEAM_DOMAIN is the Zero Trust team domain; ACCESS_AUD is the
# Application Audience tag on the Access application protecting THIS Worker --
# the dash needs its own application, separate from the calendar's and the
# Strategic Dashboard's.
#
# Until they are set the Worker runs unidentified: it shows only the tools open
# to everyone and says on the page that it is not behind Access yet, rather
# than pretending the sign-in is sound.
ACCESS_TEAM_DOMAIN = "wild-pine-bbc7.cloudflareaccess.com"
ACCESS_AUD = "c68d5b4c6d1a2ac70cff0de0ad556da6a17fd5b4b7303282b04b2d7d67ee460a"

# The one hostname the Access application actually guards.
#
# The Worker is attached to jettydash.com AND www.jettydash.com, but an Access
# application is attached to a hostname, and this one covers only the www. A
# request to the bare domain therefore reaches the Worker having never met
# Access. It is redirected here instead. See worker/canon.js.
#
# Put both hostnames on the Access application and this can be emptied -- or
# left alone, which costs nothing, because a request that arrives verified is
# never redirected.
CANONICAL_HOST = "www.jettydash.com"

# Who may edit the tiles, categories, groups and roster.
#
# Deliberately not one of the groups. The groups are data this list governs,
# so letting a group govern it back would mean anybody who could edit the
# roster could put themselves on the list that decides who edits the roster.
# This one lives in the config, where changing it is a push with a diff.
DASH_ADMINS = "jeremy@jettylife.com"

# Who may open the Budget Builder.
#
# Its own list rather than the tile assignment, because a tile is a door not
# shown and this is the one thing behind the portal that needs a door that is
# actually shut -- next year's payroll, partner draws and margin, line by
# line, before any of it is decided. Left empty it falls back to DASH_ADMINS,
# so it can never be accidentally empty.
BUDGET_USERS = "jeremy@jettylife.com"
