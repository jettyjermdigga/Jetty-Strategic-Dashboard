# The Jetty Dash is its own Worker, deployed from this directory by
# .github/workflows/dash.yml. It shares nothing with the calendar or the
# Strategic Dashboard -- separate Worker, separate URL, separate deploy -- so
# work on any one of them can never disturb the other two.
#
# It holds no data: no database, no bucket, no writes. Everything it points at
# keeps its own.

name = "jetty-dash"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# No workers.dev address, ever. Access applications are attached to hostnames,
# and jetty-dash.<account>.workers.dev is a different hostname from
# thejettydash.com -- so leaving it on would publish the whole staff portal at
# an address with nothing in front of it. The custom domain is the only way in.

workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
# Without this the platform serves matching files before the Worker runs, and
# /api/me would never reach it.
run_worker_first = true

[vars]
# Fill these in once the Access application for thejettydash.com exists.
# ACCESS_TEAM_DOMAIN is the Zero Trust team domain; ACCESS_AUD is the
# Application Audience tag on the Access application protecting THIS Worker --
# the dash needs its own application, separate from the calendar's and the
# Strategic Dashboard's.
#
# Until they are set the Worker runs unidentified: it shows only the tools open
# to everyone and says on the page that it is not behind Access yet, rather
# than pretending the sign-in is sound.
ACCESS_TEAM_DOMAIN = "wild-pine-bbc7.cloudflareaccess.com"
ACCESS_AUD = ""
