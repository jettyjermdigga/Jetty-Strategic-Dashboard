<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaign Board</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/rc_system.css">
<link rel="stylesheet" href="/assets/dash.css">
<link rel="stylesheet" href="/assets/budget.css">
<link rel="stylesheet" href="/assets/labor.css">
<link rel="stylesheet" href="/assets/campaign.css">
<meta name="robots" content="noindex,nofollow">
</head>
<body>

<header class="site-top">
  <div class="brand">
    <img src="/assets/logo.png" alt="Jetty">
    <div class="divider"></div>
    <div>
      <div class="title-main">Campaign Board</div>
      <div class="title-sub" id="sub">Loading</div>
    </div>
  </div>
  <div class="site-who"><a class="back" href="/">&larr; Back to the dash</a></div>
</header>

<main class="dash-shell bd-shell">
  <div id="notice"></div>

  <div class="bd-bar" id="bar" hidden>
    <input id="q" class="lb-q" type="search" placeholder="Find a task&hellip;"
           autocomplete="off" aria-label="Search by task, campaign or person">
    <button class="lb-clr" id="clr" type="button" hidden>Clear</button>
    <span class="bd-grow"></span>
    <span class="cp-stamp" id="stamp"></span>
    <button class="lb-add" id="refresh" type="button">Refresh</button>
  </div>

  <!-- Chips rather than a dropdown, the way the calendar asks the same kind
       of question: every option and its count visible at once, so you can
       see where the work is without opening anything. -->
  <div class="filterbar" id="filters" hidden>
    <div class="frow">
      <span class="fhint">View</span>
      <span class="fchips" id="fView"></span>
    </div>
    <div class="frow">
      <span class="fhint">People</span>
      <span class="fchips" id="fWho"></span>
    </div>
  </div>

  <div class="cp-strip" id="strip" hidden></div>

  <!-- Deadlines by campaign, and only that. One view, because one view is
       what gets used -- the by-person and timeline cuts were built and taken
       back out rather than left on screen for whoever was not using them. -->
  <div id="board"></div>
</main>

<script src="/assets/campaign.js"></script>
</body>
</html>
