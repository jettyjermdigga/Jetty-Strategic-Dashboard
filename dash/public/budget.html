<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Builder — The Jetty Dash</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/rc_system.css">
<link rel="stylesheet" href="/assets/dash.css">
<link rel="stylesheet" href="/assets/budget.css">
</head>
<body>

<header class="site-top">
  <div class="brand">
    <img src="/assets/logo.png" alt="Jetty">
    <div class="divider"></div>
    <div>
      <div class="title-main">Budget Builder</div>
      <div class="title-sub" id="sub">Loading</div>
    </div>
  </div>
  <div class="site-who"><a class="back" href="/">&larr; Back to the dash</a></div>
</header>

<main class="dash-shell bd-shell">
  <div id="notice"></div>

  <div class="bd-bar" id="bar" hidden>
    <span class="bd-lbl">View</span>
    <span class="bd-seg" id="seg"></span>

    <span class="bd-lbl">Blank cells show</span>
    <select id="base" class="bd-sel" aria-label="What a line with no decision falls back to"></select>

    <span class="bd-grow"></span>

    <span class="bd-prog" id="prog"></span>
    <a class="bd-dl" id="dl" download>Download CSV</a>
  </div>

  <p class="bd-rc" id="rc"></p>
  <p class="bd-say" id="say"></p>

  <!-- Hidden until there is something in it. An empty bordered box under a
       "not open to you" notice reads as the sheet having failed to load,
       which is a different problem from the one the notice describes. -->
  <div class="bd-wrap" id="wrap" hidden><table class="bd-t" id="t"></table></div>
</main>

<div class="bd-pl" id="pl" hidden></div>

<script src="/assets/budget.js"></script>
</body>
</html>
