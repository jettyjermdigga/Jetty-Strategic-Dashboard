<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Labor Planning — The Jetty Dash</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/rc_system.css">
<link rel="stylesheet" href="/assets/dash.css">
<link rel="stylesheet" href="/assets/budget.css">
<link rel="stylesheet" href="/assets/labor.css">
</head>
<body>

<header class="site-top">
  <div class="brand">
    <img src="/assets/logo.png" alt="Jetty">
    <div class="divider"></div>
    <div>
      <div class="title-main">Labor Planning</div>
      <div class="title-sub" id="sub">Loading</div>
    </div>
  </div>
  <div class="site-who"><a class="back" href="/">&larr; Back to the dash</a></div>
</header>

<main class="dash-shell bd-shell">
  <div id="notice"></div>

  <div class="bd-bar" id="bar" hidden>
    <a class="bd-go" href="/budget.html">&larr; Budget</a>

    <input id="q" class="lb-q" type="search" placeholder="Find a person&hellip;"
           autocomplete="off" aria-label="Search by name, title or department">
    <select id="fDiv" class="bd-sel" aria-label="Which division"></select>
    <select id="fDept" class="bd-sel" aria-label="Which department"></select>
    <select id="fPay" class="bd-sel" aria-label="How they are paid"></select>
    <select id="fCls" class="bd-sel" aria-label="Direct labor or G&amp;A"></select>
    <select id="filter" class="bd-sel" aria-label="Which people to show"></select>
    <button class="lb-clr" id="clr" type="button" hidden>Clear</button>
    <!-- Set direct-or-G&A on everybody the filters are showing. In the bar
         with the filters because that is what it follows. -->
    <select id="bulkSet" class="bd-sel lb-dsel" hidden
            aria-label="Set direct or G&amp;A for everybody shown"></select>

    <button class="lb-add" id="add" type="button">+ Add a post</button>

    <span class="bd-grow"></span>

    <span class="bd-prog" id="prog"></span>
    <a class="bd-dl" id="dl" download>Download CSV</a>
  </div>

  <div class="bd-wrap" id="wrap" hidden><table class="bd-t lb-t" id="t"></table></div>
</main>

<div class="bd-pl" id="pl" hidden></div>

<script src="/assets/labor.js"></script>
</body>
</html>
