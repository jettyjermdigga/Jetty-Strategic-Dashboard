<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Jetty Dash — Setup</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/rc_system.css">
<link rel="stylesheet" href="/assets/dash.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>

<header class="site-top">
  <div class="brand">
    <img src="/assets/logo.png" alt="Jetty">
    <div class="divider"></div>
    <div>
      <div class="title-main">The Jetty Dash</div>
      <div class="title-sub">Setup</div>
    </div>
  </div>
  <div class="site-who"><a class="back" href="/">&larr; Back to the dash</a></div>
</header>

<main class="dash-shell">
  <div id="notice"></div>

  <div class="dash-head">
    <h1>Setup</h1>
    <p class="dash-sub">
      What is on the dash, and who sees it. A tile appears once it has an
      address, to the people in its category — so an unfinished one sits here
      harmlessly until it is ready. Getting into each tool is set up on that
      tool, by whoever built it.
    </p>
  </div>

  <nav class="setup-tabs" id="tabs">
    <button class="setup-tab on" data-pane="tiles">Tiles</button>
    <button class="setup-tab" data-pane="people">People</button>
    <button class="setup-tab" data-pane="cats">Categories</button>
  </nav>

  <section class="pane" id="pane-tiles"></section>
  <section class="pane" id="pane-people" hidden></section>
  <section class="pane" id="pane-cats" hidden></section>
</main>

<script src="/assets/admin.js"></script>
</body>
</html>
