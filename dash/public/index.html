<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Jetty Dash</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/rc_system.css">
<link rel="stylesheet" href="/assets/dash.css">
</head>
<body>

<header class="site-top">
  <div class="brand">
    <img src="/assets/logo.png" alt="Jetty">
    <div class="divider"></div>
    <div>
      <div class="title-main">The Jetty Dash</div>
      <div class="title-sub">Everything, one door</div>
    </div>
  </div>
  <div class="site-who" id="who"></div>
</header>

<main class="dash-shell">
  <div id="notice"></div>

  <div class="dash-head">
    <h1 id="greeting">&nbsp;</h1>
    <p class="dash-sub" id="sub">&nbsp;</p>
  </div>

  <!-- Two panes: the columns of categories, and a list that opens beside
       them when one is picked. The grid lives on the inner .tiles the script
       emits, not on #tiles, or the sections become grid items themselves. -->
  <div class="shell" id="shell">
    <div id="tiles"></div>
    <aside class="side" id="side" hidden></aside>
  </div>

  <footer class="dash-foot" id="foot"></footer>
</main>

<script src="/assets/dash.js"></script>
</body>
</html>
