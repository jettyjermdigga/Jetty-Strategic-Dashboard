# Retail sales commissions. Its own Worker, deployed from this directory by
# .github/workflows/commissions.yml.
#
# Separate from the calendar and the dashboard on purpose: two people use this
# and it decides what the sales reps get paid. A calendar change must not be
# able to stop Amy paying somebody, and nobody with calendar access should
# inherit a view of commission rates.

name = "jetty-commissions"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"
# Without this the platform serves matching files before the Worker runs, so
# the Access check would never see a request for the page itself.
run_worker_first = true

# The Worker reads its table definitions out of worker/schema.sql at startup.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# database_id is filled in at deploy time by provision_d1.py, which creates
# the database on first run and looks it up on every run after -- so there is
# no id to paste by hand and no way for the committed file to drift.
[[d1_databases]]
binding = "DB"
database_name = "jetty_commissions"
database_id = "__D1_DATABASE_ID__"

# The monthly statements. The bytes live here; the statements table is the
# index. Nothing is served straight from the bucket -- every download goes
# through the Worker, which is what keeps it behind Access.
[[r2_buckets]]
binding = "FILES"
bucket_name = "jetty-commissions-files"

# Pull from Xero every night. Xero's own rate limit is the reason this is
# nightly rather than hourly, and the watermark means each run only asks for
# what changed since the last one.
[triggers]
crons = ["17 7 * * *"]

[vars]
# Who may open this at all. There is no read-only tier: commission rates and
# what each rep earns are not something to be half-admitted to, so not being
# on this list means the module is not yours.
#
# Addresses, matched case-insensitively, on a domain Access admits.
COMMISSION_USERS = "jeremy@jettylife.com,amy@jettylife.com"

# The email domains the commissions Access application admits. Nothing reads
# this at runtime -- Access decides, not the Worker. It is here so
# COMMISSION_USERS can be checked against it: a user on a domain Access
# blocks is a line of config that looks right and does nothing.
ACCESS_DOMAINS = "jettylife.com"

# Switches identity checking from "trust the Access header" to "verify the
# Access JWT". ACCESS_TEAM_DOMAIN is the Zero Trust team domain; ACCESS_AUD is
# the Application Audience tag on the Access application protecting THIS
# Worker -- commissions needs its own, separate from the calendar's and the
# dashboard's.
ACCESS_TEAM_DOMAIN = "wild-pine-bbc7.cloudflareaccess.com"
ACCESS_AUD = "8f073f894aae873a6934f611d6917d9d633a4706472c06b484f05107f0721718"

# The Xero app this reads through. The id is not a secret; the secret is,
# and it is set in Cloudflare rather than here --- a deploy overwrites every
# var in this file and leaves secrets alone.
#
# It is a WEB APP, not a Custom Connection, and the difference is not
# cosmetic. A Web app signs a person in once and hands back a refresh token,
# which is stored in the xero table and rotated on every use. A Custom
# Connection would be machine-to-machine with no sign-in --- and a Web app
# will happily issue one of those tokens too, carrying the full scope list
# and reaching no books at all, which is what a day was spent on.
#
# The scopes are the ones this app is PERMITTED to request, a list on its own
# Configuration page: accounting.invoices.read, accounting.payments.read,
# accounting.settings.read, plus offline_access. That list is the granular
# vocabulary and is not the OpenAPI spec's --- there is no
# accounting.transactions on it. See XERO_SCOPES in worker/xero.js.
XERO_CLIENT_ID = "CF90B6EE8120441B9F1AAF9ECDA97F85"

# The Xero account codes that mean wholesale revenue. An invoice counts when
# any of its line items hits one of these.
#
# Codes rather than account names: an account can be renamed in Xero without
# anybody telling us, and a renamed account silently matching nothing is a
# month of commission that never arrives.
#
# Empty means nothing is recognised as wholesale and a pull refuses outright,
# rather than quietly importing none.
# 271 is Wholesale Revenue. Read off the live chart of accounts on
# 2026-11-01, not typed from memory.
#
# Not 4100 (Wholesale Revenue -- Shipping): freight is subtracted
# before commission is worked out, and any invoice carrying shipping
# has a 271 line on it anyway, so adding it would only pull in
# invoices that are shipping and nothing else.
#
# Not 292 (Screen Printing Revenue) --- for now, and this is an open
# question rather than a settled one. 292 is INK and it is what the
# weekly INK journal credits. The reasoning here was that the reps do
# not earn on it; the statement Amy sent for 2026-SEP has a Jetty Ink
# section at 2% on it, so for at least some reps they do. Until that
# is settled with her the Ink section of every statement stays empty.
# See "Jetty Ink, and a figure that is not arriving" in README.md.
XERO_ACCOUNTS = "271"
